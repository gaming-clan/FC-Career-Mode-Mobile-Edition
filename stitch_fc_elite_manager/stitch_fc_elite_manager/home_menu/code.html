<div>

<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
</div>
<div class="flex items-center gap-sm mt-xs">
<span class="font-stats-md text-stats-md text-on-surface-variant">London City FC</span>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>

</button>
<button class="glass-panel rounded-lg py-md flex flex-col items-center justify-center gap-xs hover:bg-surface-bright/40 transition-colors">

<span class="font-label-caps text-label-caps text-on-surface">Load Game</span>
